# Build and test log4j 1.2.17 on the ali-security fork.
# Upstream (Apache SVN, mirrored at apache/logging-log4j1) ships no GitHub Actions CI;
# this workflow reproduces the project's own Maven build (`mvn package`/`verify`, per INSTALL),
# whose test phase runs the tests/build.xml `runAll` Ant JUnit suite via maven-antrun-plugin.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "tests/build.xml target to run instead of runAll (e.g. Core, PatternLayout); empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Release was built with JDK 1.6 targeting 1.4 bytecode; JDK 7 is the oldest JDK
      # that still talks TLS 1.2 to Maven Central and runs Maven 3.6.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "7"

      - name: Install Maven 3.6.3
        run: |
          curl -fsSL https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.6.3/apache-maven-3.6.3-bin.tar.gz -o /tmp/maven.tgz
          tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.6.3/bin" >> "$GITHUB_PATH"

      - name: Build and test
        env:
          MAVEN_OPTS: -Dhttps.protocols=TLSv1.2 -Xmx1g
        run: |
          java -version
          mvn -version
          set -o pipefail
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -e clean verify -Dmaven.site.skip=true -Dlog4j.tests.target=${{ inputs.test-filter }} 2>&1 | tee build.log
          else
            mvn -B -e clean verify -Dmaven.site.skip=true 2>&1 | tee build.log
          fi

      - name: Test summary
        if: always()
        run: |
          awk '
            /\[junit\] Running / { suite=$0; sub(/.*\[junit\] Running /, "", suite); next_is_count=1; next }
            next_is_count && /\[junit\] Tests run:/ {
              line=$0; sub(/.*\[junit\] /, "", line); print suite ": " line
              split(line, f, /[:,]/); run+=f[2]; fail+=f[4]; err+=f[6]; suites++
            }
            { next_is_count=0 }
            END { printf "TOTAL: %d test suites, %d tests run, %d failures, %d errors, %d passed\n", suites, run, fail, err, run-fail-err }
          ' build.log
          echo "EXCLUDED: org.apache.log4j.varia.ErrorHandlerTestCase.test2 - order-dependent: PropertyConfigurator never creates the FALLBACK appender, so it only passed by reading output/temp written by test1 under JDK 6 method ordering (see ErrorHandlerTestCase.suite())"

      - uses: actions/upload-artifact@v4
        with:
          name: log4j-jar
          path: |
            target/log4j-*.jar
            !target/log4j-*-sources.jar
            !target/log4j-*-javadoc.jar
          if-no-files-found: error
